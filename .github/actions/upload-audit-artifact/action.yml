name: Upload artifact with bounded audit downloads
description: Preserve the original artifact and export large public evidence in small verified parts.
inputs:
  name:
    description: Original artifact name.
    required: true
  path:
    description: Original upload path patterns.
    required: true
  if-no-files-found:
    description: Original upload behavior when no files match.
    default: warn
  compression-level:
    description: Compression level for the original artifact.
    default: '6'
  retention-days:
    description: Original and audit artifact retention.
    default: '0'
  include-hidden-files:
    description: Whether the original public file selection includes hidden files.
    default: 'false'
outputs:
  artifact-id:
    description: Original artifact ID.
    value: ${{ steps.original.outputs['artifact-id'] }}
  artifact-digest:
    description: Original artifact ZIP digest.
    value: ${{ steps.original.outputs['artifact-digest'] }}
  artifact-url:
    description: Original artifact URL.
    value: ${{ steps.original.outputs['artifact-url'] }}
  audit-index-artifact-id:
    description: Audit transport index, when large evidence required parts.
    value: ${{ steps.audit.outputs['index-artifact-id'] }}
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v4
      id: original
      if: ${{ always() }}
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
    - name: Install locked audit uploader without package scripts
      id: dependencies
      if: ${{ always() && steps.original.outputs['artifact-id'] != '' }}
      shell: bash
      env:
        AUDIT_SDK_DIR: ${{ github.action_path }}/../upload-audit-parts
      run: npm --prefix "$AUDIT_SDK_DIR" ci --ignore-scripts --no-audit --no-fund
    - uses: ./.github/actions/upload-audit-parts
      id: audit
      if: ${{ always() && steps.original.outputs['artifact-id'] != '' && steps.dependencies.outcome == 'success' }}
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        artifact-id: ${{ steps.original.outputs['artifact-id'] }}
        artifact-digest: ${{ steps.original.outputs['artifact-digest'] }}
        expected-head: ${{ github.event.pull_request.head.sha || github.sha }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
