name: GDAL library integration tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/verification/build/vcpkg-cache,readwrite

jobs:
  publisher:
    name: Publication and binary isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: |
          python -m unittest discover -s verification -p test_publish.py
          python -m unittest discover -s verification -p test_consumer_evidence.py
          python -m unittest discover -s verification -p test_command_evidence.py
          python -m unittest discover -s verification -p test_embed_data.py
          python -m unittest discover -s verification -p test_arrow_ipc_toolchain.py
          python -m unittest discover -s verification -p test_libpq_hwcap_compat.py
          python -m unittest discover -s verification -p test_libpq_windows_paths.py
          python -m unittest discover -s verification -p test_xsimd_hwcap_compat.py
          python -m unittest discover -s verification -p test_arrow_ipc_staged.py
          python -m unittest discover -s verification -p test_staged_engine.py
          python -m unittest discover -s verification -p test_driver_profile_runtime_fixture.py
          python -m unittest discover -s verification -p test_arm64_memory_host.py
          python -m unittest discover -s verification -p test_arm64_profile.py
          python -m unittest discover -s verification -p test_arm64_profile_report.py
          python -m unittest discover -s verification -p test_arm64_postgis_report.py
          python -m unittest discover -s verification -p test_postgis_arm64_fixture.py
          python -m unittest discover -s verification -p test_driver_profiles.py
          python -m unittest discover -s verification -p test_driver_profile_publications.py
          python -m unittest discover -s verification -p test_audit_parts.py
          node --test .github/actions/upload-audit-parts/index.test.cjs
          python -m unittest discover -s verification -p test_combined_driver_memory_report.py
          python -m unittest discover -s verification -p test_postgis_fixture.py
          python -m unittest discover -s verification -p test_postgis_profile_report.py
          python -m unittest discover -s verification -p test_windows_process.py
          python -m unittest discover -s verification -p test_windows_pe.py
          python -m unittest discover -s verification -p test_http_fixture_windows.py
          python -m unittest discover -s verification -p test_postgis_windows_fixture.py
          python -m unittest discover -s verification -p test_postgis_windows_report.py
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linuxX64, os: ubuntu-24.04 }
          - { target: linuxArm64, os: ubuntu-24.04 }
          - { target: macosArm64, os: macos-15 }
          - { target: mingwX64, os: windows-2025 }
          - { target: iosArm64, os: macos-15 }
          - { target: iosSimulatorArm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: python -m pip install -r verification/requirements.txt
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: verification/build/vcpkg-cache
          key: engine-${{ matrix.target }}-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            engine-${{ matrix.target }}-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-
            engine-${{ matrix.target }}-
      - name: Build GDAL and codecs
        run: python verification/ci.py '${{ matrix.target }}' --build-engine-only
      # First boot runs Apple's data migration before tests can start. Intel
      # hosted runners exhausted five minutes twice during that preparation.
      - name: Boot iOS simulator
        timeout-minutes: 15
        if: matrix.target == 'iosSimulatorArm64'
        run: |
          device="$(xcrun simctl list devices available --json | python -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for g in d["devices"].values() for x in g if x["name"].startswith("iPhone")))')"
          echo "Selected iOS simulator: $device"
          xcrun simctl boot "$device" || xcrun simctl list devices booted | grep "$device"
          xcrun simctl bootstatus "$device" -b
          echo "IOS_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Test library and independent published consumer
        # Leave time for always() evidence uploads within the existing 240m job.
        timeout-minutes: ${{ matrix.target == 'mingwX64' && 180 || 240 }}
        run: |
          if [ '${{ matrix.target }}' = mingwX64 ]; then
            python -m unittest discover -s verification -p test_embed_data.py
            python -m unittest discover -s verification -p test_command_evidence.py
            python -m unittest discover -s verification -p test_windows_process.py
            python -m unittest discover -s verification -p test_windows_pe.py
            python verification/ci.py mingwX64 --command-timeout-seconds 3600
          else
            python verification/ci.py '${{ matrix.target }}' ${IOS_DEVICE:+--ios-device "$IOS_DEVICE"}
          fi
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: engine-${{ matrix.target }}
          path: verification/build/staged/*.tar.gz
          if-no-files-found: error
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: evidence-${{ matrix.target }}
          path: |
            gdal4k/build/test-results/
            gdal4k-runtime/build/test-results/
            gdal4k-runtime/build/reports/tests/
            verification/results/ci-commands-*/
            verification/results/raster-transport-*.json
            verification/results/window-memory-*.json
            verification/results/window-memory/
            verification/results/coordinate-memory-*.json
            verification/results/coordinate-memory/
            verification/results/vector-memory-*.json
            verification/results/vector-memory/
            verification/results/file-memory-*.json
            verification/results/file-memory/
            verification/results/md-memory-*.json
            verification/results/md-memory/
            verification/results/tile-index-memory-*.json
            verification/results/tile-index-memory/
            gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/TileIndexMemoryProbe*.class
            verification/results/md-translate-memory-*.json
            verification/results/md-translate-memory/
            gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/MultiDimTranslateMemoryProbe*.class
            verification/results/footprint-memory-*.json
            verification/results/footprint-memory/
            gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/FootprintMemoryProbe*.class
            gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/MDMemoryProbe*.class
            gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/FileMemoryProbe*.class
            gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/VectorMemoryProbe*.class
            gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/CoordinateMemoryProbe*.class
            gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/RasterWindowMemoryProbe*.class
            verification/results/published-consumer-*/
            gdal4k-engine/build/engine/*/vcpkg-buildtrees/*/*.log
            gdal4k-engine/build/engine/*/cmake/build.ninja
            gdal4k-engine/build/engine/*/cmake/CMakeCache.txt
            gdal4k-engine/build/engine/*/cmake/gdal4k-static-dependencies.txt
            gdal4k-engine/build/engine/*/manifest.json
          if-no-files-found: warn

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: python -m pip install -r verification/requirements.txt
      - name: Pinned Emscripten SDK
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git verification/tools/emsdk
          test "$(git -C verification/tools/emsdk rev-parse HEAD)" = c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56
          verification/tools/emsdk/emsdk install 4.0.23
          verification/tools/emsdk/emsdk activate 4.0.23
      - uses: actions/cache/restore@v6
        id: web-cache
        with:
          path: verification/build/vcpkg-cache
          key: engine-web-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            engine-web-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**') }}-
            engine-web-
      - name: Browser test runtime
        run: |
          npm ci --prefix verification
          cd verification
          npx playwright install --with-deps chromium
          # Ubuntu's AppArmor policy blocks the user-namespace sandbox for this downloaded browser.
          # Limit the override to this disposable test runner, including independent consumers.
          chrome="$(node -p 'require("playwright").chromium.executablePath()')"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/gdal4k-chrome"
          chmod +x "$RUNNER_TEMP/gdal4k-chrome"
          echo "CHROME_BIN=$RUNNER_TEMP/gdal4k-chrome" >> "$GITHUB_ENV"
      - name: Same own engine in JS and wasmJs, Node and Chromium
        run: |
          source verification/tools/emsdk/emsdk_env.sh
          python verification/ci.py web
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.web-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: engine-web
          path: verification/build/staged/*.tar.gz
          if-no-files-found: error
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: evidence-web
          path: |
            gdal4k-runtime/build/test-results/
            verification/results/published-consumer-*/
            verification/results/web-inputs-*/
            verification/results/http-inputs-*/
            verification/results/binary-transport-*/
            verification/results/js-codec-benchmark-*.json
            verification/results/related-inputs-*/
            gdal4k-engine/build/engine/*/vcpkg-buildtrees/*/*.log

  android:
    name: Android ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: python -m pip install -r verification/requirements.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android NDK r28c
        run: |
          for attempt in 1 2 3; do
            if sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'; then break; fi
            test "$attempt" != 3 || exit 1
            rm -rf "$ANDROID_HOME/.temp"
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        id: android-cache
        with:
          path: verification/build/vcpkg-cache
          key: engine-android-${{ matrix.abi }}-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            engine-android-${{ matrix.abi }}-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**') }}-
            engine-android-${{ matrix.abi }}-
      - run: python verification/ci.py 'android-${{ matrix.abi }}'
      - name: Allow emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The app/AAR contains ARM64 only. Google's emulator translates that payload;
      # x86_64 here is the CI system image, not an Android library support target.
      - name: Execute ARM64 binaries through the emulator native bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python gdal4k-runtime/tools/run-android-tests.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_NDK_HOME" --serial emulator-5554 --abi arm64-v8a --allow-native-bridge
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: engine-android-${{ matrix.abi }}
          path: verification/build/staged/*.tar.gz
          if-no-files-found: error
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: evidence-android-${{ matrix.abi }}
          path: |
            gdal4k-runtime/build/outputs/androidTest-results/
            gdal4k-runtime/build/results/
            verification/results/published-consumer-*/
            gdal4k-engine/build/engine/*/vcpkg-buildtrees/*/*.log

  assemble:
    needs: [native, web, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - uses: actions/download-artifact@v4
        with: { pattern: 'engine-*', path: verification/build/downloads, merge-multiple: true }
      - name: Restore verified outputs only
        run: python -c 'import tarfile; from pathlib import Path; [tarfile.open(p).extractall(filter="data") for p in Path("verification/build/downloads").glob("*.tar.gz")]'
      - name: Assemble complete Maven repository and verify explicit JVM payloads and Android AAR
        run: python verification/ci.py aggregate
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: gdal4k-maven
          path: verification/build/staged/complete-maven.tar.gz
          if-no-files-found: error
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: gdal4k-jvm-maven
          path: verification/build/staged/jvm-maven.tar.gz
          if-no-files-found: error

      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: evidence-jvm-payload-selection
          path: |
            verification/results/published-consumer-jvm*/
            verification/results/common-engine-selection/
          if-no-files-found: warn

  jvm-consumers:
    name: Published JVM on ${{ matrix.os }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, binary: windows-x64 }
          - { os: macos-15, binary: macos-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - uses: actions/download-artifact@v4
        with: { name: gdal4k-jvm-maven, path: verification/build/downloads }
      - name: Consume an explicitly selected JVM payload without producer files
        run: |
          python -c 'import tarfile; tarfile.open("verification/build/downloads/jvm-maven.tar.gz").extractall(filter="data")'
          python verification/consumer.py --target jvm --no-publish --jvm-binary ${{ matrix.binary }}
          python verification/consumer.py --target jvm --no-publish --expect-missing-jvm-binary
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: evidence-published-jvm-${{ matrix.os }}
          path: verification/results/published-consumer-jvm*/
          if-no-files-found: warn

  linux-arm64-runtime:
    needs: [native, assemble]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - uses: actions/download-artifact@v4
        with: { name: engine-linuxArm64, path: verification/build/downloads }
      - uses: actions/download-artifact@v4
        with: { name: gdal4k-maven, path: verification/build/downloads }
      - run: python -c 'import tarfile; from pathlib import Path; [tarfile.open(p).extractall(filter="data") for p in Path("verification/build/downloads").glob("*.tar.gz")]'
      - run: python verification/ci.py linuxArm64-run
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: evidence-linux-arm64-runtime
          path: verification/results/published-consumer-jvm*/
