name: Build and Publish
on:
  pull_request:
    branches: [main, 'codex/**']
    paths: ['.github/workflows/**', '.github/actions/**', 'build-logic/**', 'gdal4k*/**', 'verification/**', 'sample-cli/**', 'sample-app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'kotlin-js-store/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/actions/**', 'build-logic/**', 'gdal4k*/**', 'verification/**', 'sample-cli/**', 'sample-app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'kotlin-js-store/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts after all platform checks pass
        type: boolean
        default: false
      publish_target:
        description: Maven repository
        type: choice
        options: [mavenCentral, githubPackages]
        default: mavenCentral
permissions:
  contents: read
concurrency:
  group: gdal4k-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    uses: ./.github/workflows/library-tests.yml
  publish:
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    environment: mavenCentral
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - uses: actions/download-artifact@v4
        with: { name: gdal4k-maven, path: verification/build/downloads }
      - run: python -c 'import tarfile; tarfile.open("verification/build/downloads/complete-maven.tar.gz").extractall(filter="data")'
      - name: Publish exactly the tested Maven artifacts
        env:
          PUBLISH_TARGET: ${{ inputs.publish_target || 'mavenCentral' }}
          GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_CENTRAL_NAMESPACE: ${{ vars.MAVEN_CENTRAL_NAMESPACE || 'dev.tronto.gdal4k' }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME || secrets.MAVEN_USER }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD || secrets.MAVEN_PASS }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY || secrets.SIGNING_CERT }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD || secrets.SIGNING_PASS }}
        run: python verification/publish.py
