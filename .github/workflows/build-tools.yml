name: Build tool provisioning
on:
  pull_request:
    paths: ['build-logic/**', '.github/workflows/build-tools.yml', '.github/workflows/library-tests.yml', '.github/workflows/build-and-publish.yml', 'settings.gradle.kts', 'build.gradle.kts', 'gdal4k-engine/build.gradle.kts', 'gdal4k-engine/tools/build-engine.py', 'gradle/wrapper/**', 'verification/check-toolchain-bootstrap.py', 'verification/archive_transport.py', 'verification/test_archive_transport.py', 'verification/ci.py', 'gdal4k-engine/tools/toolchains.py']
  push:
    branches: [main]
    paths: ['build-logic/**', '.github/workflows/build-tools.yml', '.github/workflows/library-tests.yml', '.github/workflows/build-and-publish.yml', 'settings.gradle.kts', 'build.gradle.kts', 'gdal4k-engine/build.gradle.kts', 'gdal4k-engine/tools/build-engine.py', 'gradle/wrapper/**', 'verification/check-toolchain-bootstrap.py', 'verification/archive_transport.py', 'verification/test_archive_transport.py', 'verification/ci.py', 'gdal4k-engine/tools/toolchains.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    name: Tools ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: linux-x64, web: true }
          - { os: ubuntu-24.04-arm, host: linux-arm64, web: true }
          - { os: macos-15, host: macos-arm64, web: true }
          - { os: macos-15-intel, host: macos-x64, web: true }
          - { os: windows-2025, host: windows-x64, web: true }
          - { os: windows-11-arm, host: windows-arm64, web: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        # Temurin JDK 17 is unavailable for native Windows ARM64; use JDK 21 there.
        with: { distribution: temurin, java-version: "${{ matrix.host == 'windows-arm64' && '21' || '17' }}" }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - name: Check native gzip and XZ support on the prepared host
        run: python verification/archive_transport.py check
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.host == 'windows-arm64' && 'arm64' || 'x64' }}
      - name: Installer and Gradle functional tests
        run: python build-logic/check-host.py test
      - name: Prepare pinned tools in paths containing spaces
        env:
          WEB: ${{ matrix.web }}
        run: python build-logic/check-host.py prepare
      - name: Real vcpkg downloads, archives and binary cache without system CLI utilities
        run: python build-logic/vcpkg-smoke.py --environment build-logic/smoke/build/environment/native.json --output build-logic/smoke/build/vcpkg-smoke
      - name: Compile and execute a small native and optional Wasm program
        env:
          WEB: ${{ matrix.web }}
        run: python build-logic/check-host.py compile
      - name: Windows ARM64 Emscripten is an explicit unsupported result
        if: matrix.host == 'windows-arm64'
        run: python build-logic/check-host.py unsupported-sdk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-tools-${{ matrix.host }}
          path: |
            build-logic/smoke/build/compiler output/result.json
            build-logic/smoke/build/vcpkg-smoke/result.json
            build-logic/smoke/build/vcpkg-smoke/*.log
            build-logic/smoke/build/unsupported.log
          if-no-files-found: warn

  native-bootstrap:
    name: Native bootstrap ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linuxX64 }
          - { os: macos-15, target: linuxX64 }
          - { os: windows-2025, target: mingwX64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - name: Check native gzip and XZ support before compiler initialization
        run: python verification/archive_transport.py check
      - name: Real Gradle prerequisites and compiler initialization from an empty store
        env:
          TARGET: ${{ matrix.target }}
        run: python verification/check-toolchain-bootstrap.py --initialize-target ${{ matrix.target }} --require-empty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-bootstrap-${{ matrix.os }}
          path: |
            build/toolchain-bootstrap/*/result.json
            build/toolchain-bootstrap/*/gradle.log
            build/toolchain-bootstrap/*/toolchain.cmake
          if-no-files-found: warn
