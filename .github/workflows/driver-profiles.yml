name: Optional driver profiles
on:
  pull_request:
    paths:
      - 'gdal4k/**'
      - 'gdal4k-runtime/**'
      - 'gdal4k-engine/**'
      - 'verification/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/driver-profiles.yml'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - 'gdal4k-engine/**'
      - 'verification/driver-profile/**'
      - 'verification/package-audit-parts.py'
      - 'verification/test_audit_parts.py'
      - '.github/workflows/driver-profiles.yml'
      - '.github/actions/**'
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: driver-profiles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  files:
    name: Profile ${{ matrix.profile }} on ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: scientific, target: linux-amd64, native: linuxX64, os: ubuntu-24.04 }
          - { profile: scientific, target: macos-arm64, native: macosArm64, os: macos-15 }
          - { profile: parquet, target: linux-amd64, native: linuxX64, os: ubuntu-24.04 }
          - { profile: parquet, target: macos-arm64, native: macosArm64, os: macos-15 }
          - { profile: http, target: linux-amd64, native: linuxX64, os: ubuntu-24.04 }
          - { profile: http, target: macos-arm64, native: macosArm64, os: macos-15 }
          - { profile: combined, target: macos-arm64, native: macosArm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/verification/build/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r verification/requirements.txt h5py==3.13.0 numpy==2.2.6
      - uses: actions/cache/restore@v6
        id: profile-cache
        with:
          path: verification/build/vcpkg-cache
          key: optional-${{ matrix.profile }}-${{ matrix.target }}-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            optional-${{ matrix.profile }}-${{ matrix.target }}-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-
            optional-${{ matrix.profile }}-${{ matrix.target }}-
            engine-${{ matrix.native }}-
      - name: Modern Bison for macOS Parquet Thrift parser
        if: runner.os == 'macOS' && (matrix.profile == 'parquet' || matrix.profile == 'combined')
        run: |
          brew install bison
          bison_bin="$(brew --prefix bison)/bin"
          "$bison_bin/bison" --file-prefix-map="$PWD=" --version
          echo "$bison_bin" >> "$GITHUB_PATH"
      - name: Default engine size baseline
        run: python verification/ci.py '${{ matrix.native }}' --build-engine-only
      - name: Isolated profile source, Native and published JVM consumers
        run: python gdal4k-engine/tools/driver-profile.py '${{ matrix.profile }}' '${{ matrix.target }}'
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.profile-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: profile-${{ matrix.profile }}-${{ matrix.target }}
          path: |
            build/driver-profiles/**/report.json
            build/driver-profiles/**/*-maven.tar.gz
          if-no-files-found: error
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: profile-evidence-${{ matrix.profile }}-${{ matrix.target }}
          path: |
            build/driver-profiles/**/inputs.json
            build/driver-profiles/**/prepared.json
            build/driver-profiles/**/source/verification/build/driver-profile.h5
            build/driver-profiles/**/source/gdal4k-runtime/src/commonTest/kotlin/dev/gdal4k/DriverProfileApiTest.kt
            build/driver-profiles/**/source/gdal4k-runtime/src/commonTest/kotlin/dev/gdal4k/NativeHttpProfileTest.kt
            build/driver-profiles/**/source/gdal4k-runtime/src/jvmTest/kotlin/dev/gdal4k/CombinedDriverMemoryProbe.kt
            build/driver-profiles/**/source/gdal4k-runtime/build/combined-driver-memory-classpath.json
            build/driver-profiles/**/source/gdal4k-runtime/build/test-results/
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/HttpMemoryProbe*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/CombinedDriverMemoryProbe*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfileApiTest*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfileApiTestKt*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfileFixtures*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfileRuntimeFixture*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DatasetApiTestKt*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DatasetOutputPathKt*.class
            build/driver-profiles/**/source/verification/results/native-postgis-profile/
            build/driver-profiles/**/source/verification/results/
            build/driver-profiles/**/source/verification/build/arrow-ipc-regression/arrow-ipc-check
            build/driver-profiles/**/source/gdal4k-engine/build/engine/*/cmake/gdal4k_http_probe
            verification/results/postgis-fixtures/**
            verification/results/native-http-fixture-*/*-requests.json
            verification/results/native-http-fixture-*/*.crt
            build/driver-profiles/**/source/verification/tools/vcpkg/buildtrees/*/*.log
            build/driver-profiles/**/source/gdal4k-engine/build/engine/*/vcpkg-buildtrees/*/*.log
          if-no-files-found: warn
  database:
    name: Profile ${{ matrix.profile }} on linux-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: postgresql }
          - { profile: combined }
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      postgis:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_DB: gdal4k
          POSTGRES_USER: gdal4k
          POSTGRES_PASSWORD: profile-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gdal4k -d gdal4k"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/verification/build/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: |
          python -m pip install -r verification/requirements.txt
          if [ '${{ matrix.profile }}' = combined ]; then
            python -m pip install h5py==3.13.0 numpy==2.2.6
          fi
      - uses: actions/cache/restore@v6
        id: profile-cache
        with:
          path: verification/build/vcpkg-cache
          key: optional-${{ matrix.profile }}-linux-amd64-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            optional-${{ matrix.profile }}-linux-amd64-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-
            optional-${{ matrix.profile }}-linux-amd64-
            engine-linuxX64-
      - name: Default engine size baseline
        run: python verification/ci.py linuxX64 --build-engine-only
      - name: Isolated database profile source and published consumers
        run: python gdal4k-engine/tools/driver-profile.py '${{ matrix.profile }}' linux-amd64
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.profile-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: profile-${{ matrix.profile }}-linux-amd64
          path: |
            build/driver-profiles/**/report.json
            build/driver-profiles/**/*-maven.tar.gz
          if-no-files-found: error
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: profile-evidence-${{ matrix.profile }}-linux-amd64
          path: |
            build/driver-profiles/**/inputs.json
            build/driver-profiles/**/prepared.json
            build/driver-profiles/**/source/verification/build/driver-profile.h5
            build/driver-profiles/**/source/gdal4k-runtime/src/commonTest/kotlin/dev/gdal4k/DriverProfileApiTest.kt
            build/driver-profiles/**/source/gdal4k-runtime/src/commonTest/kotlin/dev/gdal4k/NativeHttpProfileTest.kt
            build/driver-profiles/**/source/gdal4k-runtime/src/jvmTest/kotlin/dev/gdal4k/CombinedDriverMemoryProbe.kt
            build/driver-profiles/**/source/gdal4k-runtime/build/combined-driver-memory-classpath.json
            build/driver-profiles/**/source/gdal4k-runtime/build/test-results/
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/HttpMemoryProbe*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/CombinedDriverMemoryProbe*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfileApiTest*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfileApiTestKt*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfileFixtures*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfileRuntimeFixture*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DatasetApiTestKt*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DatasetOutputPathKt*.class
            build/driver-profiles/**/source/verification/results/
            build/driver-profiles/**/source/verification/build/arrow-ipc-regression/arrow-ipc-check
            build/driver-profiles/**/source/gdal4k-engine/build/engine/*/cmake/gdal4k_http_probe
            verification/results/native-http-fixture-*/*-requests.json
            verification/results/native-http-fixture-*/*.crt
            build/driver-profiles/**/source/verification/tools/vcpkg/buildtrees/*/*.log
            build/driver-profiles/**/source/gdal4k-engine/build/engine/*/vcpkg-buildtrees/*/*.log
          if-no-files-found: warn
  combined-arm64-cross:
    name: Cross-build combined drivers for Linux ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/verification/build/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r verification/requirements.txt
      - uses: actions/cache/restore@v6
        id: profile-cache
        with:
          path: verification/build/vcpkg-cache
          key: optional-combined-linux-arm64-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            optional-combined-linux-arm64-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-
            optional-combined-linux-arm64-
            engine-linuxArm64-
      - name: Inspect space and actual cross-build host
        run: df -h . && uname -sm
      - name: Actual default ARM64 engine size baseline
        run: python verification/ci.py linuxArm64 --build-engine-only --command-timeout-seconds 10800
      - name: Cross-link source and independent consumer, publish isolated JVM and Native packages
        run: python verification/driver-profile/arm64-profile.py cross-build --transfer verification/build/combined-linux-arm64.tar.gz
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.profile-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: profile-cross-combined-linux-arm64
          path: |
            verification/build/combined-linux-arm64.tar.gz
            verification/build/combined-linux-arm64.tar.gz.json
          if-no-files-found: error
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: profile-cross-evidence-combined-linux-arm64
          path: |
            verification/results/ci-commands-linuxArm64/
            gdal4k-engine/build/engine/linux-arm64/manifest.json
            build/driver-profiles/**/inputs.json
            build/driver-profiles/**/prepared.json
            build/driver-profiles/**/source/verification/results/
            build/driver-profiles/**/source/gdal4k-engine/build/engine/linux-arm64/manifest.json
            build/driver-profiles/**/source/gdal4k-engine/build/engine/linux-arm64/vcpkg-buildtrees/*/*.log
            build/driver-profiles/**/source/gdal4k-engine/build/engine/linux-arm64/cmake/CMakeCache.txt
            build/driver-profiles/**/source/gdal4k-engine/build/engine/linux-arm64/cmake/CMakeFiles/*/CMakeCXXCompiler.cmake
          if-no-files-found: warn
  combined-arm64-runtime:
    name: Actual combined JVM and Native on Linux ARM64
    needs: combined-arm64-cross
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r verification/requirements.txt h5py==3.13.0 numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          name: profile-cross-combined-linux-arm64
          path: verification/build/arm64-transfer
      - name: Inspect space and actual ARM64 runtime host
        run: df -h . && uname -sm && docker version
      - name: Verify unchanged transport, run actual source and published JVM and Native, close owned fixtures
        run: python verification/driver-profile/arm64-profile.py run --transfer verification/build/arm64-transfer/combined-linux-arm64.tar.gz
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: profile-combined-linux-arm64
          path: |
            build/driver-profiles/**/report.json
            build/driver-profiles/**/*-maven.tar.gz
          if-no-files-found: error
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: profile-evidence-combined-linux-arm64
          path: |
            verification/results/arm64-fixtures/**/postgis/**
            verification/results/arm64-fixtures/**/http/*-requests.json
            verification/results/arm64-fixtures/**/http/*.crt
            verification/results/arm64-commands/
            gdal4k-engine/build/verified-staged/
            build/driver-profiles/**/inputs.json
            build/driver-profiles/**/prepared.json
            build/driver-profiles/**/source/verification/results/
            build/driver-profiles/**/source/verification/build/driver-profile.h5
            build/driver-profiles/**/source/verification/build/arrow-ipc-regression/arrow-ipc-check
            build/driver-profiles/**/source/gdal4k-runtime/src/commonTest/kotlin/dev/gdal4k/DriverProfile*.kt
            build/driver-profiles/**/source/gdal4k-runtime/src/commonTest/kotlin/dev/gdal4k/NativeHttpProfileTest.kt
            build/driver-profiles/**/source/gdal4k-runtime/src/jvmTest/kotlin/dev/gdal4k/DriverProfileRuntimeFixtureJvm.kt
            build/driver-profiles/**/source/gdal4k-runtime/src/nativeTest/kotlin/dev/gdal4k/DriverProfileRuntimeFixtureNative.kt
            build/driver-profiles/**/source/gdal4k-runtime/build/combined-driver-memory-classpath.json
            build/driver-profiles/**/source/gdal4k-runtime/build/test-results/
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/HttpMemoryProbe*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/CombinedDriverMemoryProbe*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfile*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DatasetApiTestKt*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DatasetOutputPathKt*.class
            build/driver-profiles/**/source/gdal4k-engine/build/verified-staged/
            build/driver-profiles/**/source/gdal4k-engine/build/engine/linux-arm64/cmake/gdal4k_http_probe
          if-no-files-found: warn
  combined-windows:
    name: Profile combined on windows-amd64
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/verification/build/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r verification/requirements.txt h5py==3.13.0 numpy==2.2.6
      - name: Install exact Windows fixture certificate tools
        run: python -m pip install --require-hashes -r verification/driver-profile/windows-tls-requirements.txt
      - name: Verify actual Windows kernel peak memory, private ACL and owned process cleanup
        run: python verification/windows-process-selfcheck.py
      - name: Verify private Windows fixture certificate generation
        run: python -m unittest discover -s verification -p test_http_fixture_windows.py
      - uses: actions/cache/restore@v6
        id: profile-cache
        with:
          path: verification/build/vcpkg-cache
          key: optional-combined-windows-amd64-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            optional-combined-windows-amd64-${{ hashFiles('gdal4k-engine/ports/**', 'gdal4k-engine/engine/**', 'gdal4k-engine/tools/toolchains.py') }}-
            optional-combined-windows-amd64-
            engine-mingwX64-
      - name: Inspect space and actual Windows x64 host
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free
          python -c 'import platform; print(platform.system(), platform.machine())'
      - name: Actual default Windows engine size baseline
        run: python verification/ci.py mingwX64 --build-engine-only --command-timeout-seconds 10800
      - name: Isolated combined source and published JVM and Native consumers with owned fixtures
        run: python gdal4k-engine/tools/driver-profile.py combined windows-amd64
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.profile-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/upload-audit-artifact
        with:
          name: profile-combined-windows-amd64
          path: |
            build/driver-profiles/**/report.json
            build/driver-profiles/**/*-maven.tar.gz
          if-no-files-found: error
      - uses: ./.github/actions/upload-audit-artifact
        if: always()
        with:
          name: profile-evidence-combined-windows-amd64
          path: |
            verification/results/ci-commands-mingwX64/
            verification/results/windows-process-selfcheck/
            verification/results/postgis-windows-fixtures/**
            verification/results/native-http-fixture-*/*-requests.json
            verification/results/native-http-fixture-*/*.crt
            verification/results/native-http-fixture-*/certificate-tool.json
            verification/results/native-http-fixture-*/*-generator.json
            verification/results/native-http-fixture-*/*.crl
            verification/results/native-http-fixture-*/revocation-fixture.json
            verification/results/native-http-fixture-*/revocation-cleanup.json
            gdal4k-engine/build/engine/windows-amd64/manifest.json
            build/driver-profiles/**/inputs.json
            build/driver-profiles/**/prepared.json
            build/driver-profiles/**/source/verification/results/
            build/driver-profiles/**/source/verification/build/driver-profile.h5
            build/driver-profiles/**/source/verification/build/arrow-ipc-regression/arrow-ipc-check.exe
            build/driver-profiles/**/source/gdal4k/build/test-results/
            build/driver-profiles/**/source/gdal4k-runtime/build/test-results/
            build/driver-profiles/**/source/gdal4k-runtime/build/bin/mingwX64/debugTest/
            build/driver-profiles/**/source/gdal4k-runtime/src/commonTest/kotlin/dev/gdal4k/DriverProfile*.kt
            build/driver-profiles/**/source/gdal4k-runtime/src/commonTest/kotlin/dev/gdal4k/NativeHttpProfileTest.kt
            build/driver-profiles/**/source/gdal4k-runtime/src/jvmTest/kotlin/dev/gdal4k/CombinedDriverMemoryProbe.kt
            build/driver-profiles/**/source/gdal4k-runtime/build/combined-driver-memory-classpath.json
            build/driver-profiles/**/source/gdal4k-runtime/build/http-memory-classpath.json
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/HttpMemoryProbe*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/CombinedDriverMemoryProbe*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DriverProfile*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DatasetApiTestKt*.class
            build/driver-profiles/**/source/gdal4k-runtime/build/classes/kotlin/jvm/test/dev/gdal4k/DatasetOutputPathKt*.class
            build/driver-profiles/**/source/gdal4k-engine/build/engine/windows-amd64/manifest.json
            build/driver-profiles/**/source/gdal4k-engine/build/engine/windows-amd64/native-linker-options.json
            build/driver-profiles/**/source/gdal4k-engine/build/engine/windows-amd64/licenses/*.txt
            build/driver-profiles/**/source/gdal4k-engine/build/engine/windows-amd64/cmake/gdal4k_http_probe.exe
            build/driver-profiles/**/source/gdal4k-engine/build/engine/windows-amd64/vcpkg-buildtrees/*/*.log
            build/driver-profiles/**/source/gdal4k-engine/build/engine/windows-amd64/cmake/CMakeCache.txt
            build/driver-profiles/**/source/gdal4k-engine/build/engine/windows-amd64/cmake/CMakeFiles/*/CMakeCXXCompiler.cmake
          if-no-files-found: warn
