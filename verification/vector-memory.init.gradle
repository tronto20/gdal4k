// Explicit-engine diagnostics compile Kotlin without provisioning an unrelated engine payload.
// The harness verifies the independently selected library and records all class/source hashes.
gradle.projectsEvaluated {
    def target = gradle.rootProject.findProject(':gdal4k-runtime')
    if (target == null) return
    target.tasks.register('writeVectorMemoryClasspath') {
        dependsOn target.tasks.named('jvmTestClasses')
        doLast {
            def testTask = target.tasks.named('jvmTest').get()
            new File(target.buildDir, 'vector-memory-classpath.json').text = groovy.json.JsonOutput.toJson([
                classpath: testTask.classpath.asPath,
                java: testTask.javaLauncher.get().executablePath.asFile.absolutePath
            ])
        }
    }
}
