// Explicit verified engine diagnostics; compiling this probe provisions no engine payload.
gradle.projectsEvaluated {
    def target = gradle.rootProject.findProject(':gdal4k-runtime')
    if (target == null) return
    target.tasks.register('writeFileMemoryClasspath') {
        dependsOn target.tasks.named('jvmTestClasses')
        doLast {
            def testTask = target.tasks.named('jvmTest').get()
            new File(target.buildDir, 'file-memory-classpath.json').text = groovy.json.JsonOutput.toJson([
                classpath: testTask.classpath.asPath,
                java: testTask.javaLauncher.get().executablePath.asFile.absolutePath
            ])
        }
    }
}
