// Used only by bounded CI commands, including the independent consumer build.
def nativeDirectory = System.getenv('GDAL4K_NATIVE_DIAGNOSTIC_DIR')
def nativePython = System.getenv('GDAL4K_NATIVE_DIAGNOSTIC_PYTHON')
def nativeHelper = System.getenv('GDAL4K_NATIVE_DIAGNOSTIC_HELPER')
if (nativeDirectory != null && (nativePython == null || nativeHelper == null)) {
    throw new GradleException('Native diagnostics require their explicit Python helper')
}
def sourceJvmAgent64 = System.getenv('GDAL4K_SOURCE_JVM_AGENT64')
def sourceJvmAgent = null
if (sourceJvmAgent64 != null) {
    try {
        def decoded = java.util.Base64.getUrlDecoder().decode(sourceJvmAgent64)
        sourceJvmAgent = java.nio.charset.StandardCharsets.UTF_8.newDecoder()
            .decode(java.nio.ByteBuffer.wrap(decoded)).toString()
    } catch (IllegalArgumentException | java.nio.charset.CharacterCodingException error) {
        throw new GradleException('GDAL4K_SOURCE_JVM_AGENT64 must encode one UTF-8 javaagent argument', error)
    }
    if (!sourceJvmAgent.startsWith('-javaagent:') || sourceJvmAgent.indexOf('\u0000') >= 0 ||
        sourceJvmAgent.contains('\n') || sourceJvmAgent.contains('\r')) {
        throw new GradleException('GDAL4K_SOURCE_JVM_AGENT64 must encode one UTF-8 javaagent argument')
    }
}

allprojects {
    if (nativeDirectory != null) {
        def recordNative = { option, value ->
            def payload = groovy.json.JsonOutput.toJson(value)
                .getBytes(java.nio.charset.StandardCharsets.UTF_8)
            if (payload.length > 64 * 1024) {
                throw new GradleException('Native diagnostic record exceeds the 64KiB stdin limit')
            }
            project.exec {
                commandLine(nativePython, nativeHelper, '--directory', nativeDirectory,
                            option)
                standardInput = new java.io.ByteArrayInputStream(payload)
            }.assertNormalExitValue()
        }
        if (project == rootProject) {
            recordNative('--owner-json-stdin', [gradlePid: ProcessHandle.current().pid(),
                javaExecutable: new File(System.getProperty('java.home'), 'bin/java.exe').canonicalPath,
                workingDirectory: project.projectDir.canonicalPath])
        }
        tasks.matching { it.name == 'mingwX64Test' }.configureEach {
            doFirst { nativeTask ->
                // Public KGP KotlinNativeTest properties; no runner/filter changes.
                recordNative('--launch-json-stdin', [task: nativeTask.name, gradlePid: ProcessHandle.current().pid(),
                    executable: nativeTask.executable.canonicalPath,
                    workingDirectory: String.valueOf(nativeTask.workingDir ?: project.projectDir.canonicalPath),
                    args: nativeTask.args, includePatterns: nativeTask.includePatterns.toList(), excludePatterns: nativeTask.excludePatterns.toList()])
            }
        }
    }
    tasks.withType(org.gradle.api.tasks.testing.AbstractTestTask).configureEach {
        testLogging {
            events 'started', 'passed', 'failed', 'skipped'
            showStandardStreams = true
        }
    }
    if (sourceJvmAgent != null) {
        tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
            jvmArgs([sourceJvmAgent])
        }
    }
}
